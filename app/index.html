/* ending a session */
.ended-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px;padding:12px 14px;border-radius:var(--r);background:var(--yes-soft);color:var(--ink-2);font-size:14px}
.ended-bar .eb-ic{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--yes);color:var(--bg);flex:none}
.end-sum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:18px}
.end-sum div{padding:12px 14px;border-radius:12px;background:var(--surface-2)}
.end-sum dt{font-size:12px;color:var(--muted)}
.end-sum dd{font:600 20px/1.3 var(--sans);font-variant-numeric:tabular-nums}
.end-sum dd small{font-size:13px;color:var(--muted);font-weight:500}
.end-done{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:8px 0}
.end-done h2{font:600 26px/1.15 var(--sans);letter-spacing:-.03em}
.seal-ok{display:grid;place-items:center;width:72px;height:72px;border-radius:50%;background:var(--yes-soft);color:var(--yes);margin-bottom:8px;animation:pop .6s var(--ease)}
.tag-ended{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;vertical-align:2px}
/* projector: debate */
.pj[data-side="prop"]{--tint:var(--prop)} .pj[data-side="opp"]{--tint:var(--opp)}
.oxs{display:flex;flex-direction:column;align-items:center;gap:clamp(12px,2.2vh,32px);width:100%}
.oxs-mo{max-width:min(90vw,1300px)}
.oxs-mo h2{margin-top:8px;font:600 clamp(20px,2.2vw,40px)/1.2 var(--sans);letter-spacing:-.025em;color:var(--ink-2);text-wrap:balance}
.oxs-whos{display:grid;width:100%;justify-items:center}
.oxs-who{grid-area:1/1;display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.4vh,18px)}
.oxs-who.in.prop{animation:fromL .85s var(--spring) both} .oxs-who.in.opp{animation:fromR .85s var(--spring) both}
.oxs-who.leave{animation:fadeOut .45s both}
@keyframes fromL{from{opacity:0;transform:translateX(-22vw) rotate(-3deg)}to{opacity:1;transform:none}}
@keyframes fromR{from{opacity:0;transform:translateX(22vw) rotate(3deg)}to{opacity:1;transform:none}}
.oxs-side{display:inline-flex;align-items:center;gap:10px;padding:8px 18px;border-radius:99px;background:var(--surface-2);font-size:clamp(13px,1.2vw,20px);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.oxs-who.prop .oxs-side{background:color-mix(in oklab,var(--prop) 18%,transparent);color:var(--prop)}
.oxs-who.opp .oxs-side{background:color-mix(in oklab,var(--opp) 18%,transparent);color:var(--opp)}
.oxs-row{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center;font-size:clamp(14px,1.3vw,22px);color:var(--ink-2)}
.oxs-prot{display:inline-flex;align-items:center;gap:10px;padding:8px 18px;border-radius:99px;background:var(--surface-2);font-weight:600;color:var(--muted);transition:background-color .4s,color .4s}
.oxs-prot::before{content:'';width:10px;height:10px;border-radius:50%;background:currentColor}
.oxs-prot[data-state="prot"]{background:color-mix(in oklab,var(--abs) 18%,transparent);color:var(--abs)}
.oxs-prot[data-state="open"]{background:var(--yes-soft);color:var(--yes);animation:poiOpen .6s var(--spring)}
.oxs-prot[data-state="open"]::before{animation:livepulse 1.4s var(--ease) infinite}
.oxs-prot[data-state="over"]{background:var(--no-soft);color:var(--no)}
@keyframes poiOpen{40%{transform:scale(1.12)}}
.oxs-poi b{font-weight:650;color:var(--ink);display:inline-block}
.pj-chip.ox-prop{box-shadow:inset 3px 0 0 var(--prop)} .pj-chip.ox-opp{box-shadow:inset 3px 0 0 var(--opp)}
.oxr{display:flex;flex-direction:column;align-items:center;gap:clamp(14px,2.4vh,34px);width:min(100%,1200px)}
.oxr-mo{font-size:clamp(28px,3.4vw,62px);max-width:24ch}
.oxr-bars{display:grid;gap:14px;width:100%}
.oxr-row{display:grid;grid-template-columns:clamp(70px,8vw,130px) minmax(0,1fr) clamp(80px,9vw,150px);gap:18px;align-items:center;font-size:clamp(14px,1.3vw,22px);color:var(--muted);animation:fadeUp .7s var(--ease) both;animation-delay:calc(var(--d) * 200ms + 300ms)}
.oxr-row b{text-align:right;font:650 clamp(22px,2.4vw,42px) var(--sans);color:var(--ink);font-variant-numeric:tabular-nums}
.oxr-bar{display:flex;gap:3px;height:clamp(18px,2.6vh,34px);border-radius:99px;overflow:hidden;background:var(--surface-3)}
.oxr-bar i{height:100%;width:0;transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
.oxr-key{display:flex;gap:22px;justify-content:center;font-size:clamp(12px,1vw,16px);color:var(--muted)}
.oxr-key span{display:inline-flex;align-items:center;gap:8px}
.oxr-key i{width:10px;height:10px;border-radius:50%}
.oxr-swing{font-size:clamp(15px,1.5vw,26px);color:var(--ink-2)}
.oxr-swing b.prop{color:var(--prop)} .oxr-swing b.opp{color:var(--opp)}
.oxr .rs-stamp span{font-size:clamp(56px,8vw,160px)}

/* ───────────── new roll call, voice ───────────── */
.roll-ask{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:6px 0}
.roll-ask h2{font:600 24px/1.2 var(--sans);letter-spacing:-.03em}
.roll-ask p{max-width:38ch;font-size:14px;line-height:1.55}
.ra-ic{display:grid;place-items:center;width:64px;height:64px;border-radius:20px;background:var(--accent-soft);color:var(--accent);margin-bottom:6px;animation:pop .6s var(--ease)}
.seq-mic{gap:8px}
.seq-mic.on{background:var(--no-soft);color:var(--no)}
.seq-mic.on .mic-dot{width:8px;height:8px;border-radius:50%;background:currentColor;animation:livepulse 1.2s var(--ease) infinite}
.seq-heard{min-height:20px;text-align:center;font-size:13px;color:var(--muted)}
.seq-heard b{color:var(--ink)}
/* ───────────── scores ───────────── */
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.pod{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 12px;border-radius:18px;background:var(--surface-2);text-align:center;animation:rise .6s var(--ease) both;animation-delay:calc(var(--i) * 90ms)}
.pod.p1{background:linear-gradient(180deg,color-mix(in oklab,var(--gold,#F5C451) 22%,var(--surface-2)),var(--surface-2));box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--gold,#F5C451) 40%,transparent)}
.pod-medal{font-size:28px;line-height:1}
.pod b{font-size:15px;font-weight:600;overflow-wrap:anywhere}
.pod-award{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.pod-pts{font:650 22px var(--sans);font-variant-numeric:tabular-nums}
.pod-pts small{font-size:12px;color:var(--muted);font-weight:500}
.sc-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));gap:12px}
.sc-row{display:flex;flex-direction:column;gap:14px;padding:16px;border-radius:18px;background:var(--surface);border:1px solid var(--line);content-visibility:auto;contain-intrinsic-size:auto 250px}
.sc-head{display:flex;align-items:center;gap:12px}
.sc-name{flex:1;min-width:0}
.sc-name b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-name small{display:block;font-size:12.5px;color:var(--muted)}
.sc-total{text-align:right}
.sc-total b{font:650 26px/1 var(--sans);font-variant-numeric:tabular-nums}
.sc-total small{display:block;font-size:11.5px;color:var(--muted)}
.sc-crit{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px}
.sc-c{display:flex;flex-direction:column;gap:6px}
.sc-c span{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-2)}
.sc-c span b{font-variant-numeric:tabular-nums;color:var(--ink)}
.sc-c input[type=range]{width:100%;height:28px;accent-color:var(--accent);cursor:pointer}
.sc-note{height:38px;font-size:13.5px}
.rate{display:inline-flex;gap:1px;margin-left:6px}
.rate button{width:22px;height:24px;padding:0;font-size:14px;line-height:1;color:var(--faint);border-radius:6px;transition:color .2s,transform .15s var(--ease)}
.rate button.on{color:#F5B731}
.rate button:hover{transform:scale(1.2)}
@media (pointer:coarse){.rate button{width:28px;height:32px;font-size:17px}}
@media (max-width:640px){.podium{grid-template-columns:1fr}.sc-crit{grid-template-columns:1fr}}
/* ───────────── veto & QR ───────────── */
.veto-tag{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--no-soft);color:var(--no);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.qr-box{display:grid;place-items:center;width:min(280px,100%);aspect-ratio:1;margin:18px auto 0;padding:14px;border-radius:20px;background:#fff}
.qr-box svg{width:100%;height:100%}
.qr-box svg rect[fill="#ffffff"]{fill:#fff}
.qrs{display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(24px,5vw,90px);align-items:center;max-width:min(92vw,1400px);text-align:left}
.qrs-card{position:relative;width:min(44vh,40vw);aspect-ratio:1;padding:clamp(14px,1.6vw,26px);border-radius:clamp(20px,2vw,34px);background:#fff;box-shadow:0 40px 90px -40px rgba(0,0,0,.7),0 0 0 8px color-mix(in oklab,var(--accent) 30%,transparent);overflow:hidden;animation:qrIn .9s var(--spring) both}
.qrs-card svg{width:100%;height:100%;display:block}
.qrs-scan{position:absolute;left:0;right:0;height:22%;top:-22%;background:linear-gradient(180deg,transparent,color-mix(in oklab,var(--accent) 35%,transparent),transparent);animation:qrScan 3.2s ease-in-out infinite;pointer-events:none}
@keyframes qrIn{from{opacity:0;transform:scale(.6) rotate(-6deg)}to{opacity:1;transform:none}}
@keyframes qrScan{0%{top:-22%}60%,100%{top:100%}}
.qrs-txt p{margin-top:14px;max-width:32ch;font-size:clamp(16px,1.6vw,28px);line-height:1.4;color:var(--ink-2)}
.qrs-txt .qrs-upd{font-size:clamp(13px,1.1vw,18px);color:var(--muted)}
@media (max-width:700px){.qrs{grid-template-columns:1fr;justify-items:center;text-align:center}.qrs-card{width:min(70vw,48vh)}}
html.lite .qrs-scan{display:none}

/* ───────────── phones & lite mode ───────────── */
html{-webkit-tap-highlight-color:transparent}
button,a,.btn,.rc-b,.chip,.fchip{touch-action:manipulation}
@media (pointer:coarse){.input,input,select,textarea{font-size:16px}.crumbs a{min-height:40px;padding:0 8px;margin-left:-8px;border-radius:10px}.rc-card .rm{width:36px;height:36px;opacity:.85}.btn.icon.sm{min-width:36px;min-height:36px}}
.rc-card{content-visibility:auto;contain-intrinsic-size:auto 214px}
.vcard{content-visibility:auto;contain-intrinsic-size:auto 120px}
html.lite .topbar,html.lite .mtop{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--bg)}
html.lite .side{-webkit-backdrop-filter:none;backdrop-filter:none}
@media (max-width:900px){html.lite .side{background:var(--bg)}}
html.lite .modal-backdrop{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(0,0,0,.55)}
html.lite .rc-card .rm,html.lite .pj-pill,html.lite .nav-pill{-webkit-backdrop-filter:none;backdrop-filter:none}
html.lite .nav-pill{border-radius:999px;background:color-mix(in oklab,var(--ink) 13%,transparent);box-shadow:0 6px 16px -10px rgba(0,0,0,.5)}
html.lite .nav-pill::before,html.lite .nav-pill::after{display:none}
html.lite .side .nav a{border-radius:999px}
html.lite .side .nav a.on{font-weight:600}
html.lite .pj-pill{background:var(--surface)}
html.lite .enter .stagger>*:nth-child(n+19){animation:none}
html.lite .pj-amb i{animation:none}
html.lite .pj-amb i:nth-child(3){display:none}
html.lite .sp-flag .flag::before{display:none}
html.lite .rc-card:hover{box-shadow:none}
/* entrance animations without blur: the blur filter is what makes phones stutter */
html.lite .pj-scene{animation-name:sceneInL}
html.lite .pj-scene.out{animation-name:sceneOutL}
html.lite .pj-scene.iris-out{animation-name:irisOutL}
html.lite .pj-h .l{animation-name:letterInL}
html.lite .pt-d .dg.chg{animation-name:digitInL}
html.lite .sp-who.leave{animation-name:whoOutL}
html.lite .rs-stamp span{animation-name:stampL}
@keyframes sceneInL{from{opacity:0;transform:translateY(3vh) scale(.98)}to{opacity:1;transform:none}}
@keyframes sceneOutL{to{opacity:0;transform:translateY(-2vh)}}
@keyframes irisOutL{to{opacity:0;transform:scale(1.12)}}
@keyframes letterInL{from{opacity:0;transform:translateY(.4em)}to{opacity:1;transform:none}}
@keyframes digitInL{from{opacity:0;transform:translateY(-30%)}to{opacity:1;transform:none}}

@keyframes stampL{0%{opacity:0;transform:scale(2.2) rotate(-12deg)}60%{opacity:1;transform:scale(.95) rotate(-4deg)}100%{transform:rotate(-4deg)}}

// ── scores: the chair's rubric plus what Gavel has seen, ranked for the awards
const CRIT = [['sp', 'Speaking'], ['dip', 'Diplomacy'], ['know', 'Knowledge'], ['proc', 'Procedure']];
const AWARDS = ['Best Delegate', 'Outstanding Delegate', 'Honourable Mention'];
function delegStats(s) {
  const m = {}, g = c => m[c] ||= { speeches: 0, time: 0, ratings: [], motions: 0, pois: 0 };
  for (const q of Object.values(s.queues)) for (const d of q.done) { const x = g(d.code); x.speeches++; x.time += d.used || 0; if (d.rate) x.ratings.push(d.rate); }
  for (const d of s.ox.done) { const x = g(d.code); x.speeches++; x.time += d.used || 0; x.pois += d.poi || 0; if (d.rate) x.ratings.push(d.rate); }

}

  const r = s.scores[code] || {}, rubric = CRIT.reduce((a, [k]) => a + (+r[k] || 0), 0);

  const part = Math.min(10, st.speeches * 2 + st.motions + st.pois);

}

}

/* ── second screen: the chair's window keeps its current stage in a shared live state;

/* live channel (published page): presence carries roles and the chair's stage */
function pjMe() {
  if (!PJ.room) return;
  const p = PJ.role === 'projector' ? { gavel: 'projector', gst: null, want: null } : { gavel: 'chair', want: PJ.want && Date.now() - PJ.want < 180000 ? PJ.want : null, gst: PJ.gst || null };
  PJ.room.presence(p).catch(() => { });
}

  const r = PJ.room; if (!r) return;
  const others = r.peers().filter(p => p.isMe && !p.sameTab && p.presence && p.presence.gavel);
  if (PJ.role === 'projector') {
    const chair = others.filter(p => p.presence.gavel === 'chair' && p.presence.gst && p.presence.gst.m !== 'wait').sort((a, b) => b.updatedAt - a.updatedAt)[0]
      || others.find(p => p.presence.gavel === 'chair' && p.presence.gst);

  const was = pjLive();
  PJ.roomProj = others.some(p => p.presence.gavel === 'projector');
  if (PJ.roomProj && !was) pjConnected();
  if (!PJ.roomProj && was && !PJ.heard) pjStatus();

  const asker = others.find(p => p.presence.gavel === 'chair' && p.presence.want && Date.now() - p.presence.want < 180000);

}

})();

  const speeches = [['openings', 'Opening speeches'], ['gsl', 'General speakers list'], ['mod', 'Moderated caucus']].filter(([k]) => s.queues[k].done.length);
  const day = new Date(s.created).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
  return `<article class="rp">
    <header class="rp-head"><div class="rp-brand">Gavel · Session report</div><h1>${esc(s.committee)}</h1><p>${[s.topic && esc(s.topic), s.chair && 'Chaired by ' + esc(s.chair), day].filter(Boolean).join(' · ')}</p></header>

    <section><h2>Speeches</h2>${speeches.length ? speeches.map(([k, l]) => `<h3>${l}</h3>${tbl(['#', 'Delegation', 'Time used', 'At', 'Note'], [...s.queues[k].done].reverse().map((x, i) => [i + 1, esc(del(s, x.code).name), fmt(x.used), clock(x.at), esc(x.note || '')]))}`).join('') : '<p class="rp-none">No speeches recorded.</p>'}</section>
    <section><h2>Motions</h2>${tbl(['Motion', 'Proposed by', 'Details', 'Result'], [...s.motions].sort((a, b) => a.at - b.at).map(m => [MOTIONS[m.type].label, m.by ? esc(del(s, m.by).name) : 'The chair', esc([m.dur && fmt(m.dur), m.spk && `${fmt(m.spk)} per speaker`, m.topic].filter(Boolean).join(' · ')), m.result ? (m.result === 'pass' ? 'Passed' : 'Failed') : 'Not decided']))}</section>
    <section><h2>Votes</h2>${tbl(['Subject', 'Type', 'For', 'Against', 'Abstain', 'Result'], [...s.votes].reverse().map(v => [esc(v.title), (v.type === 'proc' ? 'Procedural' : 'Substantive') + (v.maj === '2/3' ? ', two-thirds' : ''), v.y, v.no, v.ab, v.veto?.length ? `Vetoed by ${esc(v.veto.map(c => del(s, c).name).join(', '))}` : v.passed ? 'Passed' : 'Failed']))}</section>
    ${s.ox.done.length || s.ox.motion ? `<section><h2>Oxford-style debate</h2>${s.ox.motion ? `<p><b>Motion:</b> ${esc(s.ox.motion)}</p>` : ''}${tbl(['Speaker', 'Side', 'Time', 'Points of information'], [...s.ox.done].reverse().map(d => [esc(del(s, d.code).name), `${ordinal(d.n)} ${SIDE[d.side]}`, fmt(d.used), d.poi || 0]))}${(() => { const r = oxResult(s.ox); return r ? `<p>Room vote before: ${s.ox.before.f} for, ${s.ox.before.a} against, ${s.ox.before.u} undecided. After: ${s.ox.after.f} for, ${s.ox.after.a} against, ${s.ox.after.u} undecided. <b>${r.tied ? 'Tied' : r.carried ? 'Motion carried' : 'Motion defeated'}</b>${r.winner ? `; the ${SIDE[r.winner]} moved the room the most` : ''}.</p>` : ''; })()}</section>` : ''}
    <section><h2>Session log</h2>${tbl(['Time', 'Event'], [...s.log].reverse().map(e => [`${new Date(e.t).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })} ${clock(e.t)}`, esc(e.m)]))}</section>
    <footer class="rp-foot">Generated by Gavel on ${esc(new Date().toLocaleString('en-GB', { dateStyle: 'long', timeStyle: 'short' }))}</footer>
  </article>`;

function importText(txt) {
  let list;
  try { const data = JSON.parse(String(txt || '').trim()); list = Array.isArray(data) ? data : data?.sessions; } catch { list = null; }
  if (!Array.isArray(list)) { toast('That is not a Gavel backup — paste the whole text you copied'); return; }
  let n = 0;
  for (const raw of list) {
    if (!raw || !raw.id || !raw.committee) continue;
    const s = normalize(raw); Object.values(s.timers).forEach(t => { t.run = false; });
    db.sessions = db.sessions.filter(x => x.id !== s.id); db.sessions.push(s); n++;
  }
  if (!n) { toast('No sessions found in that backup'); return; }
  save(); closeModal(); render(); toast(`${plural(n, 'session')} imported`);
}

});
document.addEventListener('change', e => { const el = e.target.closest('[data-ch]'); if (el && CH[el.dataset.ch]) CH[el.dataset.ch](el, e); });
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form]'); if (!f) return;
  e.preventDefault(); FORMS[f.dataset.form]?.(new FormData(f), f);
});
document.addEventListener('input', e => {
  if (e.target.matches?.('[data-in="scoreLive"]')) { const l = e.target.closest('.sc-c')?.querySelector('[data-val]'); if (l) l.textContent = e.target.value; }
  const t = e.target;
  if (t.matches('[data-pick-input]')) showPicker(t);
  else if (t.matches('[data-home-search]')) {
    const q = norm(t.value).trim(); let n = 0;
    $$('.srow').forEach(r => { const ok = !q || r.dataset.q.includes(q); r.hidden = !ok; if (ok) n++; });
    const nm = $('.nomatch'); if (nm) nm.hidden = n > 0;
  }
});
document.addEventListener('focusin', e => { if (e.target.matches?.('[data-pick-input]') && e.target.value) showPicker(e.target); });
document.addEventListener('pointerdown', e => { const inp = e.target.closest?.('[data-pick-input]'); if (inp) setTimeout(() => showPicker(inp), 0); });
document.addEventListener('focusout', e => { if (e.target.matches?.('[data-pick-input]')) setTimeout(() => { if (document.activeElement !== e.target) hidePicker(e.target); }, 120); });
document.addEventListener('keydown', e => {
  const t = e.target;
  if (t.matches?.('[data-pick-input]') && pickerKeys(e, t)) return;
  if (modal) {
    if (e.key === 'Escape') { e.preventDefault(); closeModal(); }
    else if (e.key === 'Tab') trapFocus(e);
    else if (modal.key && !isTyping(t)) modal.key(e);
    return;
  }
  if (ui.presenting) { presentKeys(e); return; }
  if (t.matches?.('[data-home-search]') && e.key === 'Escape') { t.value = ''; t.dispatchEvent(new Event('input', { bubbles: true })); t.blur(); return; }
  if (e.key === 'Enter' && t.matches?.('.srow')) { A.open(t); return; }
  if (isTyping(t) || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === '?') { e.preventDefault(); A.help(); return; }
  if (route.view !== 'session') { if (e.key === '/') { const i = $('[data-home-search]'); if (i) { e.preventDefault(); i.focus(); } } return; }
  const s = cur(); if (!s) return;
  const k = primaryTimer(), key = e.key.toLowerCase();
  if (e.code === 'Space') { if (k) { e.preventDefault(); spaceHandled = true; timerToggle(k); } }
  else if (key === 'n') { const q = queueKeyForTab(); if (q) nextSpeaker(q); else if (route.tab === 'debate') oxNext(); }
  else if (key === 'r') { if (k) resetTimer(k); }
  else if (key === 'f') { e.preventDefault(); enterPresent(); }
  else if (key === 't' || key === 'x') { e.preventDefault(); toggleTitle(); }
  else if (/^[1-9]$/.test(e.key)) go(`#/s/${encodeURIComponent(s.id)}/${TABS[+e.key - 1][0]}`);
});
document.addEventListener('keyup', e => { if (e.code === 'Space' && spaceHandled) { e.preventDefault(); spaceHandled = false; } });
document.addEventListener('mousemove', () => { if (ui.presenting || PJ.role === 'projector') idleKick(); });
document.addEventListener('keydown', e => { if (PJ.role !== 'projector') return; e.stopImmediatePropagation(); if (e.key.toLowerCase() === 'f' && !e.metaKey && !e.ctrlKey) { e.preventDefault(); A.pjfs(); } }, true);
document.addEventListener('dblclick', () => { if (PJ.role === 'projector') A.pjfs(); });
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && ui.presenting && ui.fs) exitPresent(); });
/* drag & drop reordering */
let drag = null;
document.addEventListener('dragstart', e => {
  const li = e.target.closest?.('.qlist li'); if (!li) return;
  drag = { q: li.dataset.q, i: +li.dataset.i }; li.classList.add('dragging');

});
document.addEventListener('dragover', e => {
  const li = e.target.closest?.('.qlist li'); if (!li || !drag || li.dataset.q !== drag.q) return;
  e.preventDefault();
  const r = li.getBoundingClientRect(), after = e.clientY > r.top + r.height / 2;
  $$('.drop-before,.drop-after').forEach(x => x.classList.remove('drop-before', 'drop-after'));
  li.classList.add(after ? 'drop-after' : 'drop-before');
});
document.addEventListener('drop', e => {
  const li = e.target.closest?.('.qlist li'); if (!li || !drag || li.dataset.q !== drag.q) return;
  e.preventDefault();
  const s = cur(), l = s.queues[drag.q].list, after = li.classList.contains('drop-after');
  let to = +li.dataset.i + (after ? 1 : 0); const [x] = l.splice(drag.i, 1); if (drag.i < to) to--; l.splice(to, 0, x);
  drag = null; touch(s); render();
});
document.addEventListener('dragend', () => { drag = null; $$('.dragging,.drop-before,.drop-after').forEach(x => x.classList.remove('dragging', 'drop-before', 'drop-after')); });
addEventListener('hashchange', onRoute);
addEventListener('beforeunload', save);
addEventListener('afterprint', () => { $('#print-root').innerHTML = ''; });
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => $$('[data-a="theme"]').forEach(b => { b.outerHTML = themeBtn(); }));
